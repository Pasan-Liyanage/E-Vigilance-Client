services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: e-vigilance:latest
    container_name: e-vigilance
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    # Secrets stay in server/.env, which is git-ignored. Copy server/.env.example
    # to server/.env and fill it in before running.
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5050
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5050/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
