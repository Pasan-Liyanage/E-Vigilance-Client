# Publishes the PWA (web/) to GitHub Pages.
#
# Pages is static-only, so this deploys the FRONTEND ONLY. The Express API in
# server/ must run somewhere that executes Node - see render.yaml for a
# one-click deploy, or run the Dockerfile anywhere.
#
# Point the frontend at that API with a repository variable named VITE_API_URL:
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
#   VITE_API_URL = https://your-api-host
#
# Without it the site still deploys (so you can see the UI), but sign-in and
# reports will not work until the variable is set and the workflow re-run.
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check API configuration
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::warning title=No API configured::VITE_API_URL is not set, so the deployed PWA will have no backend. Deploy the API (see render.yaml), then set the VITE_API_URL repository variable and re-run this workflow."
            echo "Deploying the UI anyway so the site is visible."
          else
            echo "API: ${{ vars.VITE_API_URL }}"
          fi

      - name: Build
        working-directory: web
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
